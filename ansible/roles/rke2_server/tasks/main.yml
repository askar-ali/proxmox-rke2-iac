---
- name: Fail early if no join token was provided
  ansible.builtin.assert:
    that: rke2_token | length > 0
    fail_msg: "Set RKE2_TOKEN (from Vault) before running."

- name: Create RKE2 config dir
  ansible.builtin.file:
    path: "{{ rke2_config_dir }}"
    state: directory
    mode: "0755"

- name: Render RKE2 server config
  ansible.builtin.template:
    src: config.yaml.j2
    dest: "{{ rke2_config_dir }}/config.yaml"
    mode: "0600"
  notify: Restart rke2-server

- name: Download RKE2 installer
  ansible.builtin.get_url:
    url: https://get.rke2.io
    dest: /usr/local/bin/rke2-install.sh
    mode: "0755"

- name: Install RKE2 server
  ansible.builtin.command: /usr/local/bin/rke2-install.sh
  environment:
    INSTALL_RKE2_VERSION: "{{ rke2_version }}"
    INSTALL_RKE2_TYPE: server
  args:
    creates: /usr/local/bin/rke2

- name: Create etcd group (required by the CIS profile)
  ansible.builtin.group:
    name: etcd
    system: true

- name: Create etcd user (required by the CIS profile)
  ansible.builtin.user:
    name: etcd
    group: etcd
    system: true
    shell: /sbin/nologin
    create_home: false

- name: Install RKE2 CIS kernel parameters
  ansible.builtin.copy:
    src: /usr/local/share/rke2/rke2-cis-sysctl.conf
    dest: /etc/sysctl.d/60-rke2-cis.conf
    remote_src: true
    mode: "0644"
  notify: Reload sysctl

- name: Apply pending handlers before starting RKE2
  ansible.builtin.meta: flush_handlers

- name: Start rke2-server (first node first)
  ansible.builtin.service:
    name: rke2-server
    state: started
    enabled: true
  throttle: 1

- name: Wait for the API server on the first node
  ansible.builtin.wait_for:
    port: 6443
    timeout: 300
  when: inventory_hostname == groups['rke2_servers'][0]

- name: Fetch kubeconfig from the first server
  ansible.builtin.fetch:
    src: /etc/rancher/rke2/rke2.yaml
    dest: "{{ playbook_dir }}/../../kubeconfig-{{ rke2_api_vip }}.yaml"
    flat: true
  when: inventory_hostname == groups['rke2_servers'][0]
