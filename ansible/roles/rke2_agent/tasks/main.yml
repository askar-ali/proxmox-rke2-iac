---
- name: Fail early if no join token was provided
  ansible.builtin.assert:
    that: rke2_token | length > 0
    fail_msg: "Set RKE2_TOKEN (from Vault) before running."

- name: Create RKE2 config dir
  ansible.builtin.file:
    path: /etc/rancher/rke2
    state: directory
    mode: "0755"

- name: Render RKE2 agent config
  ansible.builtin.template:
    src: config.yaml.j2
    dest: /etc/rancher/rke2/config.yaml
    mode: "0600"
  notify: Restart rke2-agent

- name: Download RKE2 installer
  ansible.builtin.get_url:
    url: https://get.rke2.io
    dest: /usr/local/bin/rke2-install.sh
    mode: "0755"

- name: Install RKE2 agent
  ansible.builtin.command: /usr/local/bin/rke2-install.sh
  environment:
    INSTALL_RKE2_VERSION: "{{ rke2_version }}"
    INSTALL_RKE2_TYPE: agent
  args:
    creates: /usr/local/bin/rke2

- name: Start rke2-agent
  ansible.builtin.service:
    name: rke2-agent
    state: started
    enabled: true
