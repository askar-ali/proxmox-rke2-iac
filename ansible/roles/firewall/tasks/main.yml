---
- name: Install ufw
  ansible.builtin.apt:
    name: ufw
    state: present

- name: Allow SSH
  community.general.ufw:
    rule: allow
    port: "22"
    proto: tcp
    src: "{{ firewall_ssh_cidr }}"

- name: Allow RKE2 control-plane ports from the cluster network
  community.general.ufw:
    rule: allow
    port: "{{ item.port }}"
    proto: "{{ item.proto }}"
    src: "{{ firewall_cluster_cidr }}"
  loop:
    - { port: "6443", proto: tcp }       # Kubernetes API
    - { port: "9345", proto: tcp }       # RKE2 supervisor
    - { port: "10250", proto: tcp }      # kubelet
    - { port: "2379:2381", proto: tcp }  # etcd
    - { port: "8472", proto: udp }       # VXLAN (canal/flannel)

- name: Allow pod and service CIDRs (CNI traffic must not be dropped)
  community.general.ufw:
    rule: allow
    src: "{{ item }}"
  loop: "{{ firewall_k8s_internal_cidrs }}"

- name: Default deny incoming, enable ufw
  community.general.ufw:
    state: enabled
    policy: deny
    direction: incoming
